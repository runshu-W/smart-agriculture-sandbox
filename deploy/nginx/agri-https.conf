server {
    listen 80;
    listen [::]:80;
    server_name agri.voyageage.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name agri.voyageage.com;
    ssl_certificate /etc/letsencrypt/live/agri.voyageage.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agri.voyageage.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Next standalone may construct absolute redirects using its listen address.
        proxy_redirect ~^https?://0\.0\.0\.0:3000(/.*)$ https://agri.voyageage.com$1;
        # Classroom SSE messages must reach student/teacher devices immediately.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
